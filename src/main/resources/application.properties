# ===================================================================
# Grocery Choice Backend Configuration
# ===================================================================
spring.application.name=grocery-choice-backend
server.port=${PORT:8080}

# ===================================================================
# Embedded Tomcat Thread & Memory Configuration
# ===================================================================
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
server.tomcat.accept-count=20

# ===================================================================
# Local Configuration Import (.env or application-local.properties)
# ===================================================================
spring.config.import=optional:file:.env[.properties],optional:file:application-local.properties,optional:classpath:application-local.properties

# ===================================================================
# Database Configuration (MySQL)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/grocery_choice?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===================================================================
# HikariCP Connection Pool Optimization
# ===================================================================
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=GroceryChoiceHikariPool

# ===================================================================
# JPA / Hibernate Configuration & Memory Optimization
# ===================================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.query.plan_cache_max_size=64
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=64

# ===================================================================
# Security, JWT & OTP Configuration
# ===================================================================
jwt.secret=${JWT_SECRET:grocery_choice_secure_jwt_secret_key_2026_at_least_256_bits_long_for_hmac_sha256}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}

# ===================================================================
# Razorpay Payment Gateway Configuration (Test Mode)
# ===================================================================
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# ===================================================================
# CORS Configuration
# ===================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,https://grocery-choice-customer.vercel.app,https://grocery-choice-customer-git-main-grocery-choice.vercel.app,https://grocery-choice-customer-8ntfdslp-grocery-choice.vercel.app}



