# Nixpacks configuration for Grocery Choice Backend
# Ensures JVM runs with optimal container-aware memory limits on Railway

[start]
cmd = "java $JAVA_OPTS -XX:+UseSerialGC -Xms128m -Xmx384m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -Xss512k -jar target/grocery-choice-backend-0.0.1-SNAPSHOT.jar"
